name: publish Python package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag (for example v0.1.0)
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Validate version and package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m pip install build twine
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use a stable version tag'
          metadata = Path('sdk/python/pyproject.toml').read_text()
          assert f'version = "{tag[1:]}"' in metadata, 'Tag and package version differ'
          PY
          PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests
          python -m build sdk/python --outdir dist
          python scripts/branding-check.py dist
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c 'from beepgrid import Client, BeepgridError; assert callable(Client.send_minimal)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/beepgrid/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
