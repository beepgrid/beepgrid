name: release engine binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag (for example v0.2.2)
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
      - name: Build archives from reviewed source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/build-release.py --version "$RELEASE_TAG" --output release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-archives
          path: release/
          if-no-files-found: error
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-archives
          path: release
      - name: Verify checksums and native CLI
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, subprocess, tarfile, zipfile
          root=pathlib.Path('release')
          sums={line.split()[1]:line.split()[0] for line in (root/'SHA256SUMS').read_text().splitlines()}
          version=os.environ['RELEASE_TAG'].removeprefix('v')
          for headless in ['', '-headless']:
            stem=f"beepgrid_{version}_{os.environ['RELEASE_TARGET']}{headless}"
            windows=os.name=='nt'
            archive=root/(stem+('.zip' if windows else '.tar.gz'))
            assert hashlib.sha256(archive.read_bytes()).hexdigest()==sums[archive.name]
            folder=root/stem
            folder.mkdir()
            if windows:
              with zipfile.ZipFile(archive) as z: z.extractall(folder)
            else:
              with tarfile.open(archive) as t: t.extractall(folder)
            binary=(folder/('beepgrid.exe' if windows else 'beepgrid')).resolve()
            assert subprocess.check_output([str(binary),'version'],text=True).strip()==f'beepgrid {version}'
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-archives
          path: release
      - name: Publish immutable versioned archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Beepgrid $RELEASE_TAG" --generate-notes release/*
