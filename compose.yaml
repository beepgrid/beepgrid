services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: beepgrid
      POSTGRES_PASSWORD: beepgrid
      POSTGRES_DB: beepgrid
    ports:
      - "127.0.0.1:5499:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beepgrid"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"
volumes:
  postgres:
