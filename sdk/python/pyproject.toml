[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "notif-client"
version = "0.1.0.dev0"
description = "People and agent communication through Beep Grid"
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["beepgrid", "agents", "communication"]
requires-python = ">=3.10"
license = "Apache-2.0"
[project.urls]
Homepage = "https://beepgrid.com/"
Documentation = "https://beepgrid.com/docs/sdks/python/"
Repository = "https://github.com/beepgrid/beepgrid"
Issues = "https://github.com/beepgrid/beepgrid/issues"
[tool.setuptools]
packages = ["notif"]
